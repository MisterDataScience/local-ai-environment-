name: Build reviewed batch-agent installer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "installer/**"
      - "docs/**"
      - "scripts/build_installer.py"
      - ".github/workflows/autonomous-agent-package.yml"

permissions:
  contents: write

jobs:
  package:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/persistent-batch-agent-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/persistent-batch-agent-20261011
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and test persistent batch worker
        run: |
          python -m compileall -q installer/autonomous_jobs.py
          PYTHONPATH=installer:installer/payload python -m unittest discover -s installer/tests -p test_autonomous_jobs.py -v
      - name: Build and validate reproducible single installer
        run: |
          python scripts/build_installer.py
          python scripts/build_installer.py --check
      - name: Commit rebuilt installer to reviewed branch
        run: |
          git config user.name 'local-ai-release-bot'
          git config user.email 'local-ai-release-bot@users.noreply.github.com'
          git add downloads/Mac-Local-AI-Automated-Installer.zip
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild integrated installer with autonomous batch support'
            git push origin HEAD:feature/persistent-batch-agent-20261011
          fi
