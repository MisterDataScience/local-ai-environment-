name: LOCAL AI integrated release checks

on:
  # Hosted allowance exhausted. Local edits/commits must not spend runner time.
  # Restore automatic checks only after the owner approves a new CI budget.
  workflow_dispatch:
    inputs:
      native_macos:
        description: 'Run both macOS release gates (uses hosted runner allowance)'
        type: boolean
        default: false
      publish_installer:
        description: 'Publish ZIP from main, only if all three gates pass'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  required-features:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install --disable-pip-version-check "Pillow>=11,<13" "requests>=2.32,<3" imageio-ffmpeg==0.6.0
      - run: python -m pip install --disable-pip-version-check --no-deps open-webui==0.11.1
      - name: Resolve pinned ComfyUI source archive digest
        run: |
          curl -fL --proto '=https' --proto-redir '=https' --retry 3 \
            'https://github.com/Comfy-Org/ComfyUI/archive/6b747c0428c343e1417219641db93a4fb7cb69ae.zip' \
            -o "$RUNNER_TEMP/comfyui-source.zip"
          echo '4a144a553c77397c81f6067f3f8c8ab9dffd42889af48fb35fec2c64a71c75b2  '"$RUNNER_TEMP/comfyui-source.zip" | sha256sum --check
      - run: python -m compileall -q installer
      - name: Persistent batch job regressions
        run: PYTHONPATH=installer:installer/payload python -m unittest discover -s installer/tests -p test_autonomous_jobs.py -v
      - name: Build and verify the installer from the checked-out source
        run: |
          python scripts/build_installer.py
          python scripts/build_installer.py --check
          for script in installer/*.command; do bash -n "$script"; done
      - name: Upload the validated Mac installer from this run
        uses: actions/upload-artifact@v4
        with:
          name: local-ai-captain-installer
          path: downloads/Mac-Local-AI-Automated-Installer.zip
          if-no-files-found: error
          retention-days: 14
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - run: PYTHONPATH=installer:installer/payload python -m unittest discover -s installer/tests -v
      - run: PYTHONPATH=installer:installer/payload python -m unittest discover -s installer/payload/tests -v
      - name: JavaScript policy and workflow checks
        run: node --test $(find installer/tests -name '*.mjs' ! -name 'test_conversation_browser.mjs')
      - name: Real pinned OpenCode captain protocol without model weights
        run: |
          curl -fL --retry 3 https://github.com/anomalyco/opencode/releases/download/v1.18.34/opencode-linux-x64-baseline.tar.gz -o "$RUNNER_TEMP/opencode.tar.gz"
          echo "24b0d458d21ef548b2752166303defcf7f4945b049fb4876ab78dfaf86d81b27  $RUNNER_TEMP/opencode.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/native-opencode"
          tar -xzf "$RUNNER_TEMP/opencode.tar.gz" -C "$RUNNER_TEMP/native-opencode"
          python scripts/check_native_captain.py --binary "$RUNNER_TEMP/native-opencode/opencode"


  captain-native-runtime-build:
    if: inputs.native_macos
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Verify native Apple Silicon pinned uv bootstrap archive
        run: |
          curl -fL --proto '=https' --proto-redir '=https' --retry 3 \
            https://github.com/astral-sh/uv/releases/download/0.12.20/uv-aarch64-apple-darwin.tar.gz \
            -o "$RUNNER_TEMP/uv-bootstrap.tar.gz"
          echo '848fdeb602ff1a1baacd4f6c8b7bdc6cf1ad026a6d9cf59475fda17c179743ca  '"$RUNNER_TEMP/uv-bootstrap.tar.gz" | shasum -a 256 --check
          tar -xOzf "$RUNNER_TEMP/uv-bootstrap.tar.gz" uv-aarch64-apple-darwin/uv > "$RUNNER_TEMP/uv"
          chmod 700 "$RUNNER_TEMP/uv"
          "$RUNNER_TEMP/uv" --version | grep -E '^uv 0[.]12[.]20([[:space:]]|$)'

      - name: Build the pinned MiniCPM native server without downloading model weights
        run: |
          git init "$RUNNER_TEMP/minicpm-runtime"
          git -C "$RUNNER_TEMP/minicpm-runtime" fetch --depth 1 https://github.com/ggml-org/llama.cpp.git 1b70350c92563449576bcbbf552994b1d1ed847d
          git -C "$RUNNER_TEMP/minicpm-runtime" checkout --detach FETCH_HEAD
          cmake -S "$RUNNER_TEMP/minicpm-runtime" -B "$RUNNER_TEMP/minicpm-runtime/build" -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF
          cmake --build "$RUNNER_TEMP/minicpm-runtime/build" --config Release --target llama-server -j 4
          "$RUNNER_TEMP/minicpm-runtime/build/bin/llama-server" --version
          "$RUNNER_TEMP/minicpm-runtime/build/bin/llama-server" --help > "$RUNNER_TEMP/llama-options.txt" 2>&1
          # Native compilation alone is not enough: require every option used
          # by the real installed Captain launch command.
          for option in --parallel --ctx-size --kv-unified-per-slot --jinja --cont-batching --no-context-shift --no-webui --chat-template-kwargs --mmproj; do
            if ! grep -F -q -- "$option" "$RUNNER_TEMP/llama-options.txt"; then
              echo "Pinned llama-server is missing required runtime option: $option"
              exit 1
            fi
          done

  apple-native-pdf:
    if: inputs.native_macos
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check reportlab Pillow
      - name: Native multipage, mixed OCR, chat attachment and encrypted PDF integration
        run: PYTHONPATH=installer:installer/payload python -m unittest discover -s installer/tests -p test_pdf_native.py -v
      - name: Create known local text PDF and extract with PDFKit
        run: |
          mkdir -p "$RUNNER_TEMP/pdfproject/Inbox"
          PDF_PATH="$RUNNER_TEMP/pdfproject/Inbox/sample.pdf" python - <<'PY'
          import os
          from reportlab.pdfgen import canvas
          c = canvas.Canvas(os.environ["PDF_PATH"])
          c.drawString(72, 740, "Local AI PDFKit verified text extraction")
          c.showPage()
          c.save()
          PY
          python installer/pdf_reader.py Inbox/sample.pdf --root "$RUNNER_TEMP/pdfproject" > "$RUNNER_TEMP/extracted.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ["RUNNER_TEMP"]) / "extracted.json").read_text())
          assert result["page_count"] == 1, result
          assert "PDFKit verified text extraction" in result["pages"][0]["text"], result
          print("PDFKit extraction verified on macOS runner.")
          PY
      - name: Recognize raster-only PDF using Apple Vision OCR
        run: |
          PDF_PATH="$RUNNER_TEMP/pdfproject/Inbox/scanned.pdf" python - <<'PY'
          import io, os
          from PIL import Image, ImageDraw, ImageFont
          from reportlab.pdfgen import canvas
          from reportlab.lib.utils import ImageReader
          img = Image.new("RGB", (1000, 240), "white")
          draw = ImageDraw.Draw(img)
          draw.text((40, 60), "SCANNED OCR SAMPLE 6789", fill="black",
                    font=ImageFont.load_default(size=62))
          raw = io.BytesIO()
          img.save(raw, format="PNG")
          raw.seek(0)
          c = canvas.Canvas(os.environ["PDF_PATH"])
          c.drawImage(ImageReader(raw), 36, 510, width=540, height=130)
          c.showPage()
          c.save()
          PY
          python installer/pdf_reader.py Inbox/scanned.pdf --root "$RUNNER_TEMP/pdfproject" --ocr > "$RUNNER_TEMP/scanned.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ["RUNNER_TEMP"]) / "scanned.json").read_text())
          text = result["pages"][0]["text"].upper()
          assert "SCANNED" in text and "SAMPLE" in text, result
          print("Apple Vision OCR recognized the raster-only PDF.")
          PY


  publish-validated-installer:
    name: Publish the verified installer ZIP to main
    needs: [required-features, captain-native-runtime-build, apple-native-pdf]
    if: >-
      github.ref == 'refs/heads/main' && inputs.publish_installer &&
      needs.required-features.result == 'success' &&
      needs.captain-native-runtime-build.result == 'success' &&
      needs.apple-native-pdf.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate and check signed-off source archive
        run: |
          python scripts/build_installer.py
          python scripts/build_installer.py --check
      - name: Update the downloadable archive only after all tests pass
        run: |
          if ! git diff --quiet -- downloads/Mac-Local-AI-Automated-Installer.zip; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add downloads/Mac-Local-AI-Automated-Installer.zip
            git commit -m "build: publish tested Captain installer [skip ci]"
            git push origin HEAD:main
          fi
